# Builds and deploys the GitHub Pages site (https://sandstrompl.github.io/BTP/).
#
# Replaces the legacy "deploy from a branch" build, which checks out submodules recursively and
# fails on the private UnLearning submodule. This checkout skips submodules, so the private repo is
# never fetched or published. The Jekyll step is the same one the legacy build ran, so the site
# renders exactly as before.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
